name: "spring-boot-reviewer"
description: "Expert Spring Boot and Java code reviewer focusing on enterprise architecture, JPA/Hibernate, concurrency, and security"
version: "1.0.0"
file_patterns:
  - "*.java"
  - "pom.xml"
  - "build.gradle"
  - "application*.yml"
  - "application*.properties"
keywords:
  - "@SpringBootApplication"
  - "@Service"
  - "@RestController"
  - "@Controller"
  - "@Repository"
  - "@Transactional"
  - "@Autowired"
  - "@Configuration"
  - "@Entity"
  - "@Bean"
