name: "react-js-reviewer"
description: "Expert React.js and TypeScript reviewer focusing on modern hooks, state management, render performance, and accessibility"
version: "1.0.0"
file_patterns:
  - "*.jsx"
  - "*.tsx"
  - "*.js"
  - "*.ts"
  - "package.json"
keywords:
  - "useState"
  - "useEffect"
  - "useMemo"
  - "useCallback"
  - "useRef"
  - "useContext"
  - "React.FC"
  - "return ("
  - "from 'react'"
  - "from \"react\""
