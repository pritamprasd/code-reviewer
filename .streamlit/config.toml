[theme]
base = "dark"
primaryColor = "#E95420"
backgroundColor = "#1E1E1E"
secondaryBackgroundColor = "#2D2D2D"
textColor = "#FFFFFF"
borderColor = "#444444"
baseRadius = "6px"
buttonRadius = "4px"
font = "'Ubuntu':https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
codeFont = "'Ubuntu Mono':https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap"

[theme.sidebar]
backgroundColor = "#2C001E"
secondaryBackgroundColor = "#3D0028"
textColor = "#FFFFFF"
borderColor = "#5E2750"
primaryColor = "#E95420"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
